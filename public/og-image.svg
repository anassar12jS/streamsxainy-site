<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A18"/>
      <stop offset="0.5" stop-color="#101530"/>
      <stop offset="1" stop-color="#0A0C1A"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 60) rotate(120) scale(460 560)">
      <stop stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 560) rotate(30) scale(460 380)">
      <stop stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 600) rotate(200) scale(380 300)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="120" y1="130" x2="430" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="musicGrad" x1="980" y1="380" x2="1090" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="460" y1="170" x2="900" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#pinkGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- faint grid texture -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 157.5H1200M0 315H1200M0 472.5H1200M300 0V630M600 0V630M900 0V630"/>
  </g>

  <!-- decorative rings -->
  <g opacity="0.18">
    <circle cx="160" cy="100" r="150" stroke="#F8FAFC" stroke-width="1"/>
    <circle cx="160" cy="100" r="105" stroke="#A78BFA" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="1050" cy="540" r="200" stroke="#F8FAFC" stroke-width="1"/>
    <circle cx="1050" cy="540" r="140" stroke="#F472B6" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- ===== LEFT: main poster card ===== -->
  <g filter="url(#softShadow)" transform="translate(90 120) rotate(-4 150 150)">
    <rect x="0" y="0" width="300" height="390" rx="36" fill="url(#cardGrad)"/>
    <!-- film sprocket strips -->
    <g fill="#0B1120" opacity="0.9">
      <rect x="18" y="14" width="264" height="16" rx="8"/>
      <rect x="18" y="360" width="264" height="16" rx="8"/>
    </g>
    <g fill="#F8FAFC" opacity="0.85">
      <circle cx="36" cy="22" r="4"/><circle cx="66" cy="22" r="4"/><circle cx="96" cy="22" r="4"/><circle cx="126" cy="22" r="4"/><circle cx="156" cy="22" r="4"/><circle cx="186" cy="22" r="4"/><circle cx="216" cy="22" r="4"/><circle cx="246" cy="22" r="4"/><circle cx="264" cy="22" r="4"/>
      <circle cx="36" cy="368" r="4"/><circle cx="66" cy="368" r="4"/><circle cx="96" cy="368" r="4"/><circle cx="126" cy="368" r="4"/><circle cx="156" cy="368" r="4"/><circle cx="186" cy="368" r="4"/><circle cx="216" cy="368" r="4"/><circle cx="246" cy="368" r="4"/><circle cx="264" cy="368" r="4"/>
    </g>
    <rect x="26" y="48" width="248" height="294" rx="22" fill="#0B1120" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="150" cy="160" r="56" fill="#0F172A" fill-opacity="0.85"/>
    <path d="M128 116L196 160L128 204V116Z" fill="#F8FAFC"/>
    <rect x="52" y="248" width="120" height="20" rx="10" fill="#F8FAFC" fill-opacity="0.85"/>
    <rect x="52" y="278" width="78" height="14" rx="7" fill="#F8FAFC" fill-opacity="0.5"/>
    <rect x="52" y="306" width="96" height="12" rx="6" fill="#F8FAFC" fill-opacity="0.3"/>
  </g>

  <!-- ===== RIGHT: floating music card ===== -->
  <g filter="url(#cardShadow)" transform="translate(1010 400) rotate(5 60 60)">
    <rect x="0" y="0" width="150" height="150" rx="28" fill="url(#musicGrad)"/>
    <rect x="14" y="14" width="122" height="122" rx="20" fill="#0B1120" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <!-- music note -->
    <g fill="#FFFFFF">
      <ellipse cx="66" cy="102" rx="14" ry="10" transform="rotate(-18 66 102)"/>
      <rect x="76" y="46" width="7" height="56" rx="3.5"/>
      <path d="M76 46c10 2 18 8 20 18l-8 3c-2-7-7-11-12-12z"/>
    </g>
    <rect x="30" y="118" width="60" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>
  </g>
  <!-- small live dot on music card -->
  <circle cx="1045" cy="392" r="7" fill="#34D399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1045" cy="392" r="12" fill="none" stroke="#34D399" stroke-opacity="0.5">
    <animate attributeName="r" values="8;16" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== CENTER: text ===== -->
  <g transform="translate(450 168)">
    <!-- logo mark -->
    <g transform="translate(0 -14)">
      <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#cardGrad)"/>
      <rect x="6" y="6" width="52" height="52" rx="13" fill="#0B1120" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3"/>
      <path d="M24 18L46 32L24 46V18Z" fill="#FFFFFF"/>
    </g>
    <text x="84" y="52" fill="url(#titleGrad)" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">StreamHub</text>
    <text x="88" y="104" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6">CINEMA + MUSIC</text>
    <rect x="88" y="126" width="340" height="8" rx="4" fill="url(#chipGrad)"/>
    <text x="88" y="186" fill="#D9E3F5" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="500">Movies, shows, sports, live TV &amp; music</text>

    <!-- category chips -->
    <g transform="translate(88 236)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
      <g>
        <rect x="0" y="0" width="128" height="44" rx="22" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.45"/>
        <text x="64" y="29" fill="#E9E4FF" text-anchor="middle">Movies</text>
      </g>
      <g transform="translate(140 0)">
        <rect x="0" y="0" width="104" height="44" rx="22" fill="#EC4899" fill-opacity="0.14" stroke="#EC4899" stroke-opacity="0.45"/>
        <text x="52" y="29" fill="#FCE7F3" text-anchor="middle">Series</text>
      </g>
      <g transform="translate(256 0)">
        <rect x="0" y="0" width="112" height="44" rx="22" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="56" y="29" fill="#CFFAFE" text-anchor="middle">Sports</text>
      </g>
      <g transform="translate(380 0)">
        <rect x="0" y="0" width="116" height="44" rx="22" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="58" y="29" fill="#D1FAE5" text-anchor="middle">Live TV</text>
      </g>
      <g transform="translate(508 0)">
        <rect x="0" y="0" width="120" height="44" rx="22" fill="#F472B6" fill-opacity="0.16" stroke="#F472B6" stroke-opacity="0.5"/>
        <text x="60" y="29" fill="#FDF2F8" text-anchor="middle">Xainy Music</text>
      </g>
    </g>
  </g>

  <!-- bottom-right URL badge -->
  <g transform="translate(960 560)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#111827" fill-opacity="0.7" stroke="#A78BFA" stroke-opacity="0.4"/>
    <circle cx="26" cy="23" r="6" fill="#34D399"/>
    <text x="44" y="31" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">streamsxainy</text>
  </g>
</svg>

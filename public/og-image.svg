<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1080" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0E1326"/>
      <stop offset="1" stop-color="#090B14"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 70) rotate(123) scale(420 520)">
      <stop stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 530) rotate(32) scale(420 340)">
      <stop stop-color="#F43F5E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="120" y1="140" x2="420" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="470" y1="180" x2="860" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#pinkGlow)"/>

  <g opacity="0.2">
    <circle cx="170" cy="110" r="160" stroke="#F8FAFC" stroke-width="1.2"/>
    <circle cx="1030" cy="532" r="210" stroke="#F8FAFC" stroke-width="1.2"/>
    <circle cx="930" cy="180" r="110" stroke="#A5B4FC" stroke-width="1.2"/>
  </g>

  <g filter="url(#softShadow)" transform="translate(90 125)">
    <rect x="0" y="0" width="300" height="300" rx="52" fill="url(#cardGrad)"/>
    <rect x="26" y="26" width="248" height="248" rx="40" fill="#0B1120" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="183" cy="135" r="58" fill="#0F172A" fill-opacity="0.82"/>
    <path d="M159 98L220 136L159 174V98Z" fill="#F8FAFC"/>
    <rect x="62" y="200" width="110" height="22" rx="11" fill="#F8FAFC" fill-opacity="0.84"/>
    <rect x="62" y="232" width="72" height="16" rx="8" fill="#F8FAFC" fill-opacity="0.52"/>
  </g>

  <g transform="translate(460 150)">
    <text x="0" y="90" fill="url(#titleGrad)" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-3">StreamHub</text>
    <text x="4" y="146" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">WATCH • DISCOVER • STREAM</text>
    <rect x="0" y="178" width="322" height="8" rx="4" fill="#FB7185"/>
    <text x="0" y="240" fill="#D9E3F5" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="500">Movies, shows, sports, music &amp; live TV</text>
    <g transform="translate(0 294)">
      <rect x="0" y="0" width="186" height="54" rx="27" fill="#111827" fill-opacity="0.72" stroke="#A5B4FC" stroke-opacity="0.35"/>
      <text x="32" y="35" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Open now</text>
    </g>
  </g>
</svg>

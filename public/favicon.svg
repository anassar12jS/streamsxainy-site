<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="streamhub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#streamhub-grad)" filter="url(#glow)" />

  <!-- Inner subtle border -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" />

  <!-- Cinema Reel / Play Fusion Icon -->
  <g transform="translate(18, 18)" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Film Frame -->
    <rect x="4" y="4" width="56" height="56" rx="14" fill="rgba(255, 255, 255, 0.08)" />
    <!-- Film sprocket notches -->
    <line x1="4" y1="18" x2="60" y2="18" stroke="rgba(255,255,255,0.25)" stroke-dasharray="2 6" stroke-width="3" />
    <line x1="4" y1="46" x2="60" y2="46" stroke="rgba(255,255,255,0.25)" stroke-dasharray="2 6" stroke-width="3" />
    <!-- Center Play Arrow -->
    <polygon points="26,22 46,32 26,42" fill="#ffffff" stroke="none" />
  </g>
</svg>
